services:
  - type: web
    name: supportdesk-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: supportdesk
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://codecraftapi.com/v1
      - key: AI_MODEL
        value: gpt-5.6-sol
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
